name: update

# The hosted equivalent of `daemon.py`. Same entry points, same cadences, run
# on a schedule instead of in a long-lived process.
#
# Two things about GitHub's scheduler shape this file and are worth knowing
# before trusting the numbers it produces:
#
#   * `schedule:` only fires on the repository's DEFAULT branch. On any other
#     branch this workflow exists but never runs on its own.
#   * Scheduled runs are best-effort. They queue under load and can be skipped
#     entirely; a "every 30 minutes" cron is really "usually within an hour".
#
# Neither is a problem as long as nobody reads a stale page as a live one, which
# is why every export carries its own build time and the site says how old it is
# rather than implying freshness by existing.

on:
  # A change to the site or the pipeline should reach the page without waiting
  # for a cron slot. It also means a fix to this file deploys itself, rather
  # than sitting until the next scheduled run — which matters more than it
  # sounds when the thing being fixed is the workflow.
  push:
    branches: [main]
  schedule:
    # Live pass: poll the source, rebuild the forecast, redeploy. ~1 minute.
    - cron: "7,37 * * * *"
    # Nightly: reconcile the recent past, then re-rank every model. ~10 minutes.
    - cron: "10 8 * * *"
  workflow_dispatch:
    inputs:
      backtest:
        description: "Re-run the full backtest in this pass"
        type: boolean
        default: false
      backfill_since:
        description: "Re-walk the archive back to this date (YYYY-MM-DD), e.g. after a parser fix"
        type: string
        default: ""

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Identify the crawler as this deployment. The mirror's robots.txt permits
  # crawling; being identifiable is the other half of asking politely.
  TTF_USER_AGENT: "trump-truth-forecast/0.1 (posting-volume research; +${{ github.server_url }}/${{ github.repository }})"
  TTF_REQUEST_DELAY: "1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    # 10 min covers a live pass with a long catch-up walk; the nightly backtest
    # needs the rest. Better to be killed than to run for an hour unnoticed.
    timeout-minutes: 45
    permissions:
      contents: write
      pages: write
    outputs:
      nightly: ${{ steps.mode.outputs.nightly }}
    env:
      # Lifted to the job because the `secrets` context is NOT available in a
      # step's `if:` — only env, github, inputs, job, matrix, needs, runner,
      # steps, strategy and vars are. Referencing it there does not fail the
      # step, it invalidates the entire workflow file, which GitHub then reports
      # as a run with zero jobs and no logs.
      PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Turning Pages on is normally a click in Settings. It can be automated,
      # but only with a token that is NOT the built-in GITHUB_TOKEN — the action
      # says so outright, because switching Pages on is a repository-admin
      # operation and the built-in token deliberately cannot perform one.
      #
      # So this step is opt-in and self-disabling: with no PAGES_TOKEN secret it
      # does nothing and the click is still yours to make. With one, the first
      # run enables Pages and every later run finds it already on — at which
      # point the secret has done its job and should be deleted, along with the
      # token behind it. A standing admin-scoped credential is a poor trade for
      # a one-time setup step.
      #
      # The secret is the only correct home for it. Never a file in the repo:
      # this repository is public, and a committed token is scraped by bots
      # within seconds of the push.
      - name: Enable Pages if a setup token is present
        if: env.PAGES_TOKEN != ''
        uses: actions/configure-pages@v5
        with:
          token: ${{ env.PAGES_TOKEN }}
          enablement: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Decide the pass
        id: mode
        run: |
          nightly=false
          if [ "${{ github.event.schedule }}" = "10 8 * * *" ]; then nightly=true; fi
          if [ "${{ inputs.backtest }}" = "true" ]; then nightly=true; fi
          echo "nightly=$nightly" >> "$GITHUB_OUTPUT"
          echo "nightly pass: $nightly"

      # The archive lives in the cache, not in git: it is a 25 MB binary that
      # changes every pass, and committing it every half hour would bloat the
      # repository for no benefit. Losing it costs one backfill (~6 minutes),
      # which `daemon.py` performs automatically when the database is missing —
      # the source is the source of truth, the cache is only a shortcut.
      - name: Restore the post archive
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: data/posts.db
          key: posts-db-${{ github.run_id }}
          restore-keys: |
            posts-db-

      - name: Re-walk the archive
        if: inputs.backfill_since != ''
        run: python -m truthforecast.pipeline --backfill "${{ inputs.backfill_since }}"

      - name: Live pass
        if: steps.mode.outputs.nightly != 'true'
        run: python daemon.py --once

      - name: Nightly pass
        if: steps.mode.outputs.nightly == 'true'
        run: python daemon.py --backtest --reconcile

      - name: Save the post archive
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/posts.db
          key: posts-db-${{ github.run_id }}

      # Three different things go into git, for three different reasons.
      #
      # The exports are the cold-start seed: after a cache eviction the site
      # still has a leaderboard to show while the first backfill runs. Only the
      # nightly pass writes them — committing them every half hour would add ~50
      # commits a day to say the same thing.
      #
      # `data/live_forecasts.jsonl` is the prospective record, and git is its
      # only durable home: every run starts from a fresh checkout, so a line
      # appended and not committed is gone. It has to be written on EVERY pass,
      # because the forecast it registers is the first one made at each cut and
      # the nightly pass is not the first. The file only changes when the cut
      # changes, so this is about one commit a day, not fifty.
      #
      # `data/record` is here for exactly the same reason, and was missing.
      # `refresh_forecast` appends to `forecast_history.jsonl` (the fine-grained
      # companion to the register, so a market snapshot can be matched to the
      # forecast that was on the page at that moment) and `posts_ledger.jsonl`
      # (first-seen times and deletion history — the two things a rebuild from
      # the mirror cannot return, and the evidence the ReTruth re-dating and the
      # deleted-post exclusion rest on). Both were written on every pass and
      # discarded with the container, which also meant the ledger saw an empty
      # file every time and re-fingerprinted all 34k posts as if it were its
      # first run. record.yml commits the same directory on its own schedule;
      # the two workflows write disjoint files in it, so appends rebase cleanly.
      - name: Commit the record and, nightly, the exports
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live_forecasts.jsonl data/record 2>/dev/null || true
          msg="Register the live forecast"
          if [ "${{ steps.mode.outputs.nightly }}" = "true" ]; then
            git add data/exports
            msg="Refresh exports (nightly backtest) and register the live forecast"
          fi
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "$msg"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            # Non-fatal: a protected branch or a race is a reason to skip the
            # commit, not a reason to skip publishing the site.
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push refused; record not seeded"
          fi

      # The deployed bundle is `site/` with the exports mounted underneath it,
      # which is the layout `daemon.py serve` reproduces locally so both resolve
      # data through the same relative path.
      - name: Assemble the site
        run: |
          mkdir -p _site/data/exports
          cp -R site/. _site/
          cp data/exports/*.json _site/data/exports/
          touch _site/.nojekyll
          ls -la _site _site/data/exports

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
