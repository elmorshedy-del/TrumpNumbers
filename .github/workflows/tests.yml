name: tests

# The ingest tests are the ones that matter here: they pin the timezone the
# listing renders in and the rule that only top-level posts count. Both are
# assumptions about someone else's HTML, and both corrupt the series silently
# when they stop holding.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -q

  actionlint:
    # The `secrets` context in a step `if:` does not fail that step — it
    # invalidates the whole workflow file, and GitHub reports that as a run with
    # zero jobs and no logs. Nothing else in this repository would have caught
    # it, and it silently stopped every scheduled run.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@v2
