name: tests

# The ingest tests are the ones that matter here: they pin the timezone the
# listing renders in and the rule that only top-level posts count. Both are
# assumptions about someone else's HTML, and both corrupt the series silently
# when they stop holding.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -q

  actionlint:
    # The `secrets` context in a step `if:` does not fail that step — it
    # invalidates the whole workflow file, and GitHub reports that as a run with
    # zero jobs and no logs. Nothing else in this repository would have caught
    # it, and it silently stopped every scheduled run.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@v2

  records:
    # The records are the only data here that cannot be rebuilt, and losing
    # them looks like an ordinary diff. This job is the reason nobody has to
    # notice: it re-reads every protected file as it stood before the change
    # and refuses anything that is not a pure append. See the script for what
    # counts as protected and why rotation is the one allowed deletion.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The base commit has to be in the checkout to be compared against,
          # and the default shallow clone does not contain it.
          fetch-depth: 0
      - name: Records may only grow
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_records_append_only.py --base "$BASE"
